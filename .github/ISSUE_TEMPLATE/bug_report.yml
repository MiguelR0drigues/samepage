name: Bug report
description: Something does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Never paste tokens, connection strings or conversation text. Security issues go to a private advisory instead.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: dropdown
    id: part
    attributes:
      label: Part
      options:
        - Server (MCP / Worker)
        - Capture client (hooks, extractor, setup)
        - Dashboard
        - Admin scripts
        - Docs
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: OS, Node version, Claude Code version (CLI or desktop app).
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant lines from `~/.samepage/capture.log` or the Worker logs.
      render: text
